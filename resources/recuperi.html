<!DOCTYPE html>
<html>
<head>
<style>
.overlay {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.5);
justify-content: center;
align-items: center;
}
.finestra-modal {
background-color: white;
padding: 20px;
border-radius: 5px;
width: 300px;
box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
.bottone-nascosto {
width: 10%;
height: 3%;
opacity: 0;
}
.pulsante-home {
background-color: lightblue;
margin: 0;
padding: 0;
}
.testo-pulsante-home {
text-decoration: none;
font-family: verdana;
font-color: black;
}
</style>
</head>
<body>
<button type="submit" value="Submit" class='pulsante-home'>
<a class='testo-pulsante-home' href='../../index.html'>Torna alla Home</a>
</button>
<div class='bottone-nascosto'>
<button onclick='window.open("../storage/foto-bottone.jpg")'></button>
</div>
<h2>Esegui script senza listasku</h2>
<form id="lancia_script_no_sku" action="/resources/esegui_script.php" method="POST">
<label for="nome_script_no_sku">Seleziona Script</label>
<select id="nome_script_no_sku" name="nome_script_no_sku">
<option value="mt">MT HELMETS</option>
</select>
<input type="submit" value="Conferma">
</form>
<h2>Esegui script con listasku</h2>
<form id="lancia_script" action="/resources/esegui_script.php" method="POST" onsubmit="return apri_finestra_sku(event);">
<label for="nome_script">Seleziona Script</label>
<select id="nome_script" name="nome_script">
<option value="arrow">ARROW</option>
<option value="brembo">BREMBO</option>
<option value="gpr">GPR</option>
<option value="polini">POLINI</option>
<option value="polisport">POLISPORT</option>
<option value="puig">PUIG</option>
<option value="quadlock">QUADLOCK</option>
</select>
<input type="hidden" name="lista_codici" id="lista_codici_nascosto">
<input type="submit" value="Conferma">
</form>
<h2>Scarica file output recuperi</h2>
<form id="recupera_file" action = "/resources/recupera_file_script.php" method="POST">
<label for="nome_file">Seleziona il fornitore di cui scaricare l ultimo recupero</label>
<select id="nome_file" name="nome_file">
<option value="arrow">ARROW</option>
<option value="brembo">BREMBO</option>
<option value="gpr">GPR</option>
<option value="mt">MT HELMETS</option>
<option value="polini">POLINI</option>
<option value="polisport">POLISPORT</option>
<option value="puig">PUIG</option>
<option value="quadlock">QUADLOCK</option>
</select>
<input type="submit" value="Conferma">
</form>
<div id="modal_sku" class="overlay">
<div class="finestra-modal">
<p><strong>Inserisci lista degli SKU</strong></p>
<textarea id="codici" rows="10" cols="40" placeholder="Incolla o scrivi qui gli SKU senza prefisso..."></textarea>
<br><br>
<button type="button" onclick="invia_dati()">Conferma e Avvia</button>
<button type="button" onclick="chiudi_finestra()">Annulla</button>
</div>
</div>
<script>
function apri_finestra_sku(event) {
event.preventDefault();
document.getElementById('modal_sku').style.display = 'flex';
return false;
}
function invia_dati() {
var testo = document.getElementById('codici').value;
document.getElementById('lista_codici_nascosto').value = testo;
document.getElementById('modal_sku').style.display = 'none';
document.getElementById('lancia_script').submit();
}
function chiudi_finestra() {
document.getElementById('modal_sku').style.display = 'none';
}
</script>
</body>
</html>
